<div class="row">
  <div class="col">
    <div class="alert alert-warning">
      {{ date | date : "full" | uppercase }}
    </div>
    <app-list [cvs]="cvs"></app-list>
  </div>
  <div class="col">
    <app-cv-card [cv]="cvService.selectedCv()"></app-cv-card>
  </div>
</div>
@defer (on viewport) {
  <app-embauche></app-embauche>
} @placeholder {
  <div class="alert alert-light mt-3">Préchargement différé de la section Embauche</div>
} @loading (minimum 300ms) {
  <div class="alert alert-light mt-3">Chargement de la section Embauche...</div>
}
