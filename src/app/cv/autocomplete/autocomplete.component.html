<form [formGroup]="form">
  <input
    type="text"
    class="form-control"
    formControlName="search"
    placeholder="Search CV by name"
  />
</form>

<div class="row mt-3">
  <div class="col-md-6">
    <ul class="list-group">
      <li
        *ngFor="let cv of matchingCvs()"
        class="list-group-item list-group-item-action"
        role="button"
        (click)="selectCv(cv)"
      >
        {{ cv.firstname }} {{ cv.name }}
      </li>
    </ul>
  </div>
  <div class="col-md-6">
    <app-cv-card [cv]="selectedCv()"></app-cv-card>
  </div>
</div>
